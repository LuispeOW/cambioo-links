<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambioo — Coming Soon</title>
<meta name="description" content="Cambioo is a memory-based multiplayer card game for 2–6 players. Coming soon to iOS.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --purple-deep: #1A0828;
    --purple-mid: #2A0F3E;
    --gold: #F5C842;
    --violet: #7C3AAD;
    --cream: #F5EFE0;
    --cream-dim: #C9BEDA;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--purple-deep);
    color: var(--cream);
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  a { color: inherit; text-decoration: none; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
    overflow: hidden;
  }

  .hero-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 900px;
    height: 900px;
    background: radial-gradient(circle, rgba(124,58,173,0.35) 0%, rgba(124,58,173,0) 65%);
    pointer-events: none;
  }

  .sparkle {
    position: absolute;
    color: var(--gold);
    opacity: 0.5;
    animation: twinkle 3.5s ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(0.85); }
    50% { opacity: 0.7; transform: scale(1.1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .sparkle { animation: none; opacity: 0.35; }
  }

  .logo-mark {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--gold);
    margin-bottom: 40px;
  }

  .logo-mark svg { width: 26px; height: 26px; }

  .eyebrow {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(245, 200, 66, 0.1);
    border: 1px solid rgba(245, 200, 66, 0.3);
    color: var(--gold);
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 7px 16px;
    border-radius: 999px;
    margin-bottom: 28px;
  }

  .hero h1 {
    position: relative;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: clamp(2.6rem, 8vw, 4.8rem);
    line-height: 1.02;
    color: var(--cream);
    margin-bottom: 20px;
  }

  .hero h1 .accent { color: var(--gold); }

  .hero p.sub {
    position: relative;
    max-width: 460px;
    margin: 0 auto;
    font-size: 1.1rem;
    color: var(--cream-dim);
  }

  /* ---------- Footer ---------- */
  footer {
    border-top: 1px solid rgba(245, 200, 66, 0.15);
    padding: 28px 24px;
  }

  .footer-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }

  .footer-links {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    font-size: 0.85rem;
    color: var(--cream-dim);
  }

  .footer-links a:hover { color: var(--gold); }

  .footer-copy {
    width: 100%;
    text-align: center;
    font-size: 0.8rem;
    color: var(--cream-dim);
    opacity: 0.6;
    margin-top: 6px;
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-glow" aria-hidden="true"></div>
  <svg class="sparkle" width="18" height="18" viewBox="0 0 24 24" style="top:20%; left:14%; animation-delay:0s;" aria-hidden="true"><path d="M12 2L14.5 8.5L21 12L14.5 15.5L12 22L9.5 15.5L3 12L9.5 8.5L12 2Z" fill="currentColor"/></svg>
  <svg class="sparkle" width="12" height="12" viewBox="0 0 24 24" style="top:28%; right:16%; animation-delay:1.1s;" aria-hidden="true"><path d="M12 2L14.5 8.5L21 12L14.5 15.5L12 22L9.5 15.5L3 12L9.5 8.5L12 2Z" fill="currentColor"/></svg>
  <svg class="sparkle" width="14" height="14" viewBox="0 0 24 24" style="bottom:22%; left:20%; animation-delay:2s;" aria-hidden="true"><path d="M12 2L14.5 8.5L21 12L14.5 15.5L12 22L9.5 15.5L3 12L9.5 8.5L12 2Z" fill="currentColor"/></svg>
  <svg class="sparkle" width="10" height="10" viewBox="0 0 24 24" style="bottom:30%; right:22%; animation-delay:0.6s;" aria-hidden="true"><path d="M12 2L14.5 8.5L21 12L14.5 15.5L12 22L9.5 15.5L3 12L9.5 8.5L12 2Z" fill="currentColor"/></svg>

  <div class="logo-mark">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2L14.5 8.5L21 12L14.5 15.5L12 22L9.5 15.5L3 12L9.5 8.5L12 2Z" fill="currentColor"/>
    </svg>
    Cambioo
  </div>

  <span class="eyebrow">Coming soon to iOS</span>
  <h1>Something's<br><span class="accent">brewing.</span></h1>
  <p class="sub">Cambioo is a memory card game for 2–6 players. We're putting the finishing touches on it. check back soon!</p>
</header>

<footer>
  <div class="footer-inner">
    <div class="footer-links">
      <a href="/privacy">Privacy Policy</a>
      <a href="/terms">Terms of Use</a>
      <a href="/support">Support</a>
      <a href="/guidelines">Community Guidelines</a>
    </div>
    <div class="footer-copy">© 2026 Tau Interactive LLC. All rights reserved.</div>
  </div>
</footer>

</body>
</html>
